<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arindra - Portfolio</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E40AF',
            primaryHover: '#1E3A8A',
            bodyBg: '#FFFFFF',
            lightBg: '#F5F7FF',
            darkText: '#111827',
            secondaryText: '#6B7280',
            success: '#22C55E',
            highlight: '#F59E0B',
          },
          fontFamily: {
            sans: ['Inter', 'Poppins', 'Noto Sans Khmer', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-blue-50 m-0 p-0 text-darkText font-sans flex flex-col min-h-screen">

<section class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-sm max-w-3xl mx-auto space-y-6" id="info-form">
  <div>
    <span class="text-xs font-bold text-primary uppercase tracking-wider">Get In Touch</span>
    <h2 class="text-2xl sm:text-3xl font-extrabold text-darkText mt-1">ទម្រង់បែបបទបំពេញព័ត៌មាន</h2>
    <p class="text-secondaryText text-sm mt-1">សូមបំពេញព័ត៌មានខាងក្រោម ដើម្បីផ្ញើសារ ឬទំនាក់ទំនងមកកាន់ខ្ញុំ។</p>
  </div>

  <form action="#" method="POST" class="space-y-4">
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="fullname" class="block text-xs font-semibold text-darkText mb-1">ឈ្មោះពេញ (Full Name) <span class="text-red-500">*</span></label>
        <input type="text" id="fullname" name="fullname" required placeholder="ឧ. ចាន់ សុខា" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
      <div>
        <label for="email" class="block text-xs font-semibold text-darkText mb-1">អ៊ីមែល (Email) <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" required placeholder="example@domain.com" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
    </div>

    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="phone" class="block text-xs font-semibold text-darkText mb-1">លេខទូរស័ព្ទ (Phone Number)</label>
        <input type="tel" id="phone" name="phone" placeholder="012 345 678" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
      <div>
        <label for="subject" class="block text-xs font-semibold text-darkText mb-1">គោលបំណង (Subject)</label>
        <select id="subject" name="subject" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition text-slate-700">
          <option value="internship">ឱកាសការងារ / Internship</option>
          <option value="freelance">ការងារ Freelance / Project</option>
          <option value="general">សាកសួរព័ត៌មានទូទៅ</option>
        </select>
      </div>
    </div>

    
    <div>
      <label for="message" class="block text-xs font-semibold text-darkText mb-1">សារ / ព័ត៌មានបន្ថែម (Message) <span class="text-red-500">*</span></label>
      <textarea id="message" name="message" rows="4" required placeholder="សរសេរសារ ឬព័ត៌មានលម្អិតនៅទីនេះ..." 
        class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition resize-none"></textarea>
    </div>

  
    <div class="pt-2 flex justify-end">
      <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-primary hover:bg-blue-900 text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i> ផ្ញើព័ត៌មាន
      </button>
    </div>
  </form>
</section>
 
    
</body>
</html>
