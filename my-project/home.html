<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arindra - Contact Form</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E40AF',
            primaryHover: '#1E3A8A',
            bodyBg: '#FFFFFF',
            lightBg: '#F5F7FF',
            darkText: '#111827',
            secondaryText: '#6B7280',
            success: '#22C55E',
            highlight: '#F59E0B',
          },
          fontFamily: {
            sans: ['Inter', 'Poppins', 'Noto Sans Khmer', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-blue-50 m-0 p-0 text-darkText font-sans flex flex-col min-h-screen justify-center items-center py-10">

<section class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-sm max-w-3xl w-full mx-auto space-y-6" id="info-form">
  <div>
    <span class="text-xs font-bold text-primary uppercase tracking-wider">Get In Touch</span>
    <h2 class="text-2xl sm:text-3xl font-bold text-darkText mt-1">Information filling form</h2>
    <p class="text-secondaryText text-sm mt-1">Please fill out the information below to send me a message or contact me.</p>
  </div>

  <form action="https://formspree.io/f/xnpnvaaz" method="POST" class="space-y-5">
   
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="fullname" class="block text-xs font-semibold text-darkText mb-1">Full Name <span class="text-red-500">*</span></label>
        <input type="text" id="fullname" name="fullname" required placeholder="your full name" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
      <div>
        <label for="email" class="block text-xs font-semibold text-darkText mb-1">Email <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" required placeholder="example@domain.com" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
    </div>

   
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="phone" class="block text-xs font-semibold text-darkText mb-1">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="phone number" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition">
      </div>
      <div>
        <label for="subject" class="block text-xs font-semibold text-darkText mb-1">Subject</label>
        <select id="subject" name="subject" 
          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition text-slate-700">
          <option value="Internship">Internship</option>
          <option value="Freelance / Project">Freelance / Project</option>
          <option value="Ask for general information">Ask for general information</option>
        </select>
      </div>
    </div>

  
    <div>
      <label for="message" class="block text-xs font-semibold text-darkText mb-1">Message <span class="text-red-500">*</span></label>
      <textarea id="message" name="message" rows="4" required placeholder="Write a message or additional information here...." 
        class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-primary focus:bg-white transition resize-none"></textarea>
    </div>

    
    <div class="space-y-2 pt-2">
      <label class="block text-xs font-semibold text-darkText mb-2">Select one:</label>

      <div class="space-y-2.5 text-sm text-slate-700">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="timeline" value="Today/immediately" class="w-4 h-4 text-red-600 focus:ring-red-500 border-slate-300">
          <span>Today/immediately</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="timeline" value="Within the month" class="w-4 h-4 text-red-600 focus:ring-red-500 border-slate-300">
          <span>Within the month</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="timeline" value="No timeline/just exploring" class="w-4 h-4 text-red-600 focus:ring-red-500 border-slate-300">
          <span>No timeline/just exploring</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="timeline" value="Within the week" checked class="w-4 h-4 text-red-600 focus:ring-red-500 border-slate-300">
          <span>Within the week</span>
        </label>
      </div>
    </div>

    
    <div class="pt-4 flex justify-end gap-4">
      <a href="index.html" class="w-full sm:w-auto px-6 py-2.5 bg-primary hover:bg-blue-900 text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs"></i> Back
      </a>
      <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-primary hover:bg-blue-900 text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i> Send
      </button>
    </div>
  </form>
</section>
    
</body>
</html>
